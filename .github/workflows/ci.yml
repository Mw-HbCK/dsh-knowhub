name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 全量校验（类型检查 + 构建 + 渲染冒烟 + 单测）
        run: node scripts/ci.mjs
